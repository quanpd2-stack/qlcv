<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dữ liệu &amp; sao lưu · Chấm công &amp; Tính lương</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22%230284c7%22%2F%3E%3Cpath%20d%3D%22M9%2010h14M9%2016h14M9%2022h9%22%20stroke%3D%22%23fff%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--p:#0284c7;--p-d:#0369a1;--p-50:#f0f9ff;--p-100:#e0f2fe;--ink:#082f49;--ink2:#0c4a6e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Be Vietnam Pro','Segoe UI',Roboto,Arial,sans-serif;font-size:14px;color:#1f2937;background:#f3f5f9;-webkit-font-smoothing:antialiased;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--p-d)}
svg{flex:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}

/* ===== Khung ===== */
.shell{display:flex;min-height:100vh}
.sidebar{width:250px;flex:none;background:linear-gradient(180deg,var(--ink),var(--ink2));color:#e5e7eb;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40}
.brand{display:flex;gap:12px;align-items:center;padding:20px 18px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{width:42px;height:42px;border-radius:12px;background:var(--p);display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.3);flex:none}
.brand .logo svg{width:22px;height:22px}
.brand b{display:block;font-size:15px;color:#fff;line-height:1.25}
.brand small{color:rgba(255,255,255,.55);font-size:12px}
.nav{flex:1;overflow:auto;padding:6px 10px 12px}
.nav-group{margin:16px 12px 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:rgba(255,255,255,.4);font-weight:700}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:rgba(255,255,255,.78);text-decoration:none;cursor:pointer;font-weight:500;margin:2px 0;transition:background .15s}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:var(--p);color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.nav a svg{width:18px;height:18px;opacity:.9}
.side-foot{padding:14px;border-top:1px solid rgba(255,255,255,.08)}
.save-state{font-size:12px;color:rgba(255,255,255,.7);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.save-state i{width:8px;height:8px;border-radius:50%;background:#22c55e;flex:none}
.save-state.dirty i{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.25)}
.btn-save{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;height:40px;border:0;border-radius:10px;background:#fff;color:var(--ink);font-weight:700;cursor:pointer;transition:.15s}
.btn-save:hover{background:var(--p-100)}
.btn-save svg{width:17px;height:17px}
.credit{font-size:11px;color:rgba(255,255,255,.38);margin-top:12px;text-align:center}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(243,245,249,.92);backdrop-filter:blur(8px);display:flex;align-items:center;gap:14px;padding:14px 28px;border-bottom:1px solid #e3e7ef;min-height:70px}
.topbar h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}
.topbar p{margin:2px 0 0;color:#6b7280;font-size:13px}
.top-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.content{padding:22px 28px 48px}
.menu-btn{display:none}
.backdrop{display:none}

/* ===== Nút, ô nhập ===== */
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;border:1px solid #d6dce7;background:#fff;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;transition:.15s;text-decoration:none;color:#1f2937}
.btn:hover{border-color:var(--p);color:var(--p-d)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff}
.btn.pri:hover{background:var(--p-d);border-color:var(--p-d);color:#fff}
.btn.xl{background:#107c41;border-color:#107c41;color:#fff}
.btn.xl:hover{background:#0b5e31;color:#fff}
.btn.danger{color:#dc2626;border-color:#fecaca}
.btn.danger:hover{background:#fef2f2;border-color:#dc2626;color:#b91c1c}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.on{background:var(--p-50);border-color:var(--p);color:var(--p-d)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ibtn{width:30px;height:30px;border-radius:8px;border:0;background:transparent;display:inline-grid;place-items:center;cursor:pointer;color:#667085;vertical-align:middle}
.ibtn svg{width:16px;height:16px}
.ibtn:hover{background:var(--p-50);color:var(--p-d)}
.ibtn.del:hover{background:#fee2e2;color:#dc2626}
.inp{height:36px;border:1px solid #d6dce7;border-radius:9px;padding:0 11px;background:#fff;outline:none;min-width:0;transition:border .15s,box-shadow .15s}
.inp:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--p-100)}
textarea.inp{height:auto;padding:9px 11px;min-height:76px;resize:vertical}
select.inp{padding-right:28px}
.inp.sm{height:30px;font-size:12.5px;border-radius:8px;padding:0 8px}
.inp.num{text-align:right;font-variant-numeric:tabular-nums}
.search{position:relative;display:inline-flex}
.search input{padding-left:34px;width:260px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#98a2b3}
.seg{display:inline-flex;background:#e9edf4;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12.5px;color:#475467}
.seg button.on{background:#fff;color:var(--p-d);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* ===== Bố cục, thẻ ===== */
.grid{display:grid;gap:18px}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols-21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.cols-12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.mt{margin-top:18px}.mb{margin-bottom:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:#667085}
.small{font-size:12.5px}
.r{text-align:right}.c{text-align:center}
.nowrap{white-space:nowrap}
.tnum{font-variant-numeric:tabular-nums}
.pos{color:#15803d}.neg{color:#dc2626}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:18px}
.kpi{background:#fff;border-radius:14px;padding:16px 18px;border:1px solid #e6e9f0;box-shadow:0 1px 2px rgba(16,24,40,.04);position:relative;overflow:hidden}
.kpi:after{content:'';position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:var(--p-50);opacity:.6}
.kpi .k-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--p-50);color:var(--p);position:relative;z-index:1}
.kpi .k-ic svg{width:19px;height:19px}
.kpi .k-lb{color:#667085;font-size:12.5px;font-weight:500;margin-top:12px}
.kpi .k-v{font-size:22px;font-weight:700;margin-top:3px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-sub{font-size:12px;color:#667085;margin-top:3px}
.t-green .k-ic{background:#dcfce7;color:#16a34a}
.t-red .k-ic{background:#fee2e2;color:#dc2626}
.t-amber .k-ic{background:#fef3c7;color:#d97706}
.t-blue .k-ic{background:#dbeafe;color:#2563eb}
.t-violet .k-ic{background:#ede9fe;color:#7c3aed}
.t-cyan .k-ic{background:#cffafe;color:#0891b2}
.card{background:#fff;border-radius:14px;border:1px solid #e6e9f0;box-shadow:0 1px 2px rgba(16,24,40,.04);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid #eef0f5;min-height:56px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:15px;font-weight:700}
.card-h .sub{color:#667085;font-size:12.5px}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:16px 18px}
.card-b.p0{padding:0}
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;background:var(--p-50);border:1px solid var(--p-100);margin-bottom:16px;flex-wrap:wrap}
.banner.warn{background:#fffbeb;border-color:#fde68a}
.banner svg{width:20px;height:20px;color:var(--p)}
.banner.warn svg{color:#d97706}
.empty{padding:40px 20px;text-align:center;color:#98a2b3}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#f2f4f7;color:#475467;white-space:nowrap}
.b-green{background:#dcfce7;color:#15803d}
.b-red{background:#fee2e2;color:#b91c1c}
.b-amber{background:#fef3c7;color:#b45309}
.b-blue{background:#dbeafe;color:#1d4ed8}
.b-violet{background:#ede9fe;color:#6d28d9}
.b-cyan{background:#cffafe;color:#0e7490}
.b-p{background:var(--p-50);color:var(--p-d)}
.avatar{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;background:var(--p-100);color:var(--p-d);font-weight:700;font-size:12px;flex:none}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;font-weight:600}
.who small{color:#667085;font-size:12px}

/* ===== Bảng ===== */
.tbl-card{background:#fff;border-radius:14px;border:1px solid #e6e9f0;box-shadow:0 1px 2px rgba(16,24,40,.04);overflow:hidden}
.tbl-tools{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid #eef0f5;flex-wrap:wrap}
.tbl-wrap{overflow:auto;max-height:calc(100vh - 300px);min-height:200px}
.tbl-wrap.free{max-height:none}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{position:sticky;top:0;background:#f7f9fc;text-align:left;font-weight:700;color:#475467;padding:10px 12px;border-bottom:1px solid #e3e7ef;white-space:nowrap;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;z-index:2}
.tbl td{padding:9px 12px;border-bottom:1px solid #f0f2f6;vertical-align:middle;white-space:nowrap}
.tbl td.wrap{white-space:normal;min-width:220px}
.tbl tbody tr:hover td{background:var(--p-50)}
.tbl tbody tr.click{cursor:pointer}
.tbl th.r,.tbl td.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl th.c,.tbl td.c{text-align:center}
.tbl tfoot td{font-weight:700;background:#f7f9fc;border-top:2px solid #e3e7ef;position:sticky;bottom:0;z-index:2}
.tbl th.sort{cursor:pointer;user-select:none}
.tbl th.sort:after{content:'↕';opacity:.3;margin-left:5px}
.tbl th.asc:after{content:'↑';opacity:1}
.tbl th.desc:after{content:'↓';opacity:1}
.tbl td.act{white-space:nowrap;text-align:right;width:1%}
.tbl-pager{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:12.5px;color:#667085;gap:10px;flex-wrap:wrap}
.tbl .inp.sm{width:110px}
.pg{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.pg select{margin:0 8px 0 4px}
.pg-n{min-width:30px;height:30px;padding:0 8px;border:1px solid #d6dce7;background:#fff;border-radius:8px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:600;color:#475467}
.pg-n:hover:not(:disabled){border-color:var(--p);color:var(--p-d)}
.pg-n.on{background:var(--p);border-color:var(--p);color:#fff}
.pg-n:disabled{opacity:.4;cursor:default}
.pg-dot{padding:0 4px;color:#98a2b3}
.pg-host .tbl-pager{border-top:1px solid #eef0f5}
.tbl.compact td{padding:7px 10px}
.tbl.compact th{padding:8px 10px}

/* ===== Modal, form ===== */
.modal-wrap{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:100;overflow:auto;animation:fade .15s}
.modal{background:#fff;border-radius:16px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:pop .18s}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid #eef0f5}
.modal-h h3{margin:0;font-size:16px}
.modal-h .ibtn{margin-left:auto}
.modal-b{padding:18px 20px;max-height:72vh;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid #eef0f5;background:#fafbfc;border-radius:0 0 16px 16px}
.modal-f .left{margin-right:auto}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.form.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.form.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:12.5px;font-weight:600;color:#344054}
.field.full{grid-column:1/-1}
.field.s2{grid-column:span 2}
.field small{color:#98a2b3;font-size:11.5px}
.field .inp{width:100%}
.field.chk{flex-direction:row;align-items:center;gap:8px}
.req{color:#ef4444;font-style:normal}
.fsec{grid-column:1/-1;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--p-d);border-bottom:1px solid #eef0f5;padding-bottom:6px;margin-top:6px}
.img-pick{display:flex;gap:12px;align-items:center}
.img-pick .ph{width:72px;height:72px;border-radius:12px;border:1px dashed #cbd2dd;display:grid;place-items:center;overflow:hidden;background:#f8fafc;color:#98a2b3;flex:none}
.img-pick .ph img{width:100%;height:100%;object-fit:contain}
.thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;background:#f2f4f7;display:block}

/* ===== Thông báo, gợi ý ===== */
#toasts{position:fixed;right:20px;bottom:20px;z-index:300;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:#111827;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13.5px;max-width:400px;animation:pop .2s;border-left:4px solid var(--p)}
.toast svg{width:16px;height:16px;vertical-align:-3px;margin-right:4px;flex-shrink:0}
.toast.ok{border-left-color:#22c55e}
.toast.err{border-left-color:#ef4444}
#tip{position:fixed;pointer-events:none;background:#111827;color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;z-index:400;white-space:pre;display:none;box-shadow:0 6px 18px rgba(0,0,0,.25);line-height:1.4}

/* ===== Biểu đồ ===== */
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:#475467;margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.donut{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut svg{width:170px;height:170px}
.dl{flex:1;min-width:170px}
.dl div{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed #eef0f5;font-size:13px}
.dl div:last-child{border-bottom:0}
.dl i{width:10px;height:10px;border-radius:3px;flex:none}
.dl b{margin-left:auto;font-variant-numeric:tabular-nums}
.dl em{color:#98a2b3;font-style:normal;width:48px;text-align:right;font-size:12px}
.hb{margin:10px 0}
.hb-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:10px}
.hb-top span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-top b{font-variant-numeric:tabular-nums;white-space:nowrap}
.hb-bar{height:8px;background:#f0f2f6;border-radius:99px;overflow:hidden}
.hb-bar i{display:block;height:100%;border-radius:99px;background:var(--p)}
.funnel .fn{display:flex;align-items:center;gap:12px;margin:8px 0}
.funnel .fn-l{width:130px;font-size:13px;flex:none}
.funnel .fn-b{flex:1;height:30px;background:#f3f5f9;border-radius:8px;overflow:hidden}
.funnel .fn-b i{display:flex;align-items:center;height:100%;border-radius:8px;color:#fff;font-size:12px;font-weight:700;padding:0 10px;min-width:34px}

/* ===== Màn hình nhỏ ===== */
@media(max-width:1100px){.cols-2,.cols-3,.cols-21,.cols-12{grid-template-columns:minmax(0,1fr)}}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s}
  body.nav-open .sidebar{transform:none}
  body.nav-open .backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}
  .menu-btn{display:inline-grid}
  .topbar{padding:10px 16px;flex-wrap:wrap;position:static}
  .top-actions{margin-left:0;width:100%;justify-content:flex-start}
  .content{padding:16px}
  .search input{width:200px}
  .form,.form.c3,.form.c4{grid-template-columns:minmax(0,1fr)}
  .field.s2{grid-column:auto}
}

/* ===== In ===== */
#print-root{display:none}
.pr{color:#111;font-size:12px;font-family:'Be Vietnam Pro','Segoe UI',Arial,sans-serif}
.pr-head{display:flex;gap:14px;align-items:center;border-bottom:2px solid var(--p);padding-bottom:10px;margin-bottom:12px}
.pr-head img{max-height:58px;max-width:120px}
.pr-co b{font-size:15px;color:var(--p-d);text-transform:uppercase}
.pr-co div{font-size:11.5px;color:#444}
.pr-meta{margin-left:auto;text-align:right;font-size:11px;color:#555}
.pr h2{text-align:center;margin:12px 0 4px;font-size:19px;text-transform:uppercase;color:#111;letter-spacing:.02em}
.pr .pr-sub{text-align:center;color:#555;margin-bottom:14px;font-style:italic}
.pr table{width:100%;border-collapse:collapse}
.pr th{background:var(--p);color:#fff;padding:6px;font-size:10.5px;border:1px solid var(--p-d);text-align:center}
.pr td{border:1px solid #c9ced8;padding:5px 6px;font-size:11px;vertical-align:top}
.pr td.r{text-align:right;white-space:nowrap}
.pr td.c{text-align:center}
.pr tfoot td{font-weight:700;background:#eef1f6}
.pr-signs{display:flex;justify-content:space-around;margin-top:26px;text-align:center;page-break-inside:avoid}
.pr-signs div{min-width:150px}
.pr-signs b{display:block}
.pr-signs i{font-size:11px;color:#666}
.pr-signs .sp{height:72px}
.pr-note{margin-top:10px;font-size:11.5px}
.pagebreak{page-break-after:always;break-after:page}
@media print{
  body{background:#fff}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.is-printing>*:not(#print-root){display:none!important}
  body.is-printing #print-root{display:block}
  body:not(.is-printing) .sidebar,body:not(.is-printing) .topbar,body:not(.is-printing) .no-print{display:none!important}
  body:not(.is-printing) .content{padding:0}
  .card,.kpi,.tbl-card{box-shadow:none;break-inside:avoid}
  .tbl-wrap{max-height:none!important;overflow:visible!important}
  #print-root .card{border:1px solid #ddd}
  #print-root .kpis{grid-template-columns:repeat(3,1fr)}
  #print-root .cols-2,#print-root .cols-21,#print-root .cols-12{grid-template-columns:1fr 1fr}
  #print-root .no-print,#print-root .tbl-tools,#print-root .tbl-pager,#print-root td.act,#print-root th.act{display:none!important}
}

</style>
</head>

function docSo(n) {
  n = Math.round(Math.abs(+n || 0));
  if (n === 0) return 'Không đồng';
  const cs = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín'];
  const units = ['', ' nghìn', ' triệu', ' tỷ', ' nghìn tỷ', ' triệu tỷ'];
  const doc3 = (x, full) => {
    const tr = Math.floor(x / 100), ch = Math.floor(x % 100 / 10), dv = x % 10; let s = '';
    if (full || tr > 0) s += cs[tr] + ' trăm';
    if (ch > 1) { s += ' ' + cs[ch] + ' mươi'; if (dv === 1) s += ' mốt'; else if (dv === 5) s += ' lăm'; else if (dv === 4) s += ' tư'; else if (dv > 0) s += ' ' + cs[dv]; }
    else if (ch === 1) { s += ' mười'; if (dv === 5) s += ' lăm'; else if (dv > 0) s += ' ' + cs[dv]; }
    else if (dv > 0) { if (full || tr > 0) s += ' lẻ'; s += ' ' + cs[dv]; }
    return s.trim();
  };
  const g = []; let t = n; while (t > 0) { g.push(t % 1000); t = Math.floor(t / 1000); }
  let out = [];
  for (let i = g.length - 1; i >= 0; i--) { if (g[i] === 0) continue; out.push(doc3(g[i], i !== g.length - 1) + units[i]); }

}

const Print = {

const nh = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/gi, 'd').toLowerCase().replace(/[^a-z0-9]/g, '');
function eNum(v) { if (typeof v === 'number') return Math.round(v); const s = String(v ?? '').trim(); if (!s) return 0; if (/^-?\d+[.,]\d{1,2}$/.test(s)) return Math.round(parseFloat(s.replace(',', '.'))); return F.parse(s); }
function eDate(v) {
  if (v === '' || v == null) return '';
  if (typeof v === 'number' && v > 59) { const d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 864e5); return d.toISOString().slice(0, 10); }
  const s = String(v).trim(); let m;
  if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  if ((m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/))) return `${m[3]}-${pad(+m[2])}-${pad(+m[1])}`;
  if (/^\d{4}$/.test(s)) return s + '-01-01';
  return '';
}
function eText(k, v) {
  let s = typeof v === 'number' ? String(Math.round(v)) : String(v ?? '').trim();
  if (k === 'sdt' && /^[1-9]\d{8}$/.test(s)) s = '0' + s;          // Excel làm mất số 0 đầu
  if (k === 'cccd' && /^\d{11}$/.test(s)) s = '0' + s;
  return s;
}
function empParse(rows, fromPaste) {
  rows = rows.filter(r => r && r.some(c => String(c ?? '').trim() !== ''));
  let hr = -1, map = {};
  for (let r = 0; r < Math.min(rows.length, 20) && hr < 0; r++) {
    const m = {};
    rows[r].forEach((h, i) => { const n = nh(h); const c = EIMP.find(c => c.alias.includes(n)); if (c && m[c.key] === undefined) m[c.key] = i; });
    if (m.ten !== undefined) { hr = r; map = m; }
  }
  if (hr < 0) { if (!fromPaste) throw new Error('Không thấy cột "Họ và tên" trong file. Tải file mẫu về để điền cho đúng nhé'); EIMP.forEach((c, i) => map[c.key] = i); }
  const out = [], seen = new Set(); let auto = 0;
  DB.employees.forEach(e => { const n = parseInt(String(e.ma).replace(/\D/g, '')) || 0; if (n > auto) auto = n; });
  const nextMa = () => { let m; do m = 'NV' + String(++auto).padStart(3, '0'); while (DB.employees.some(e => e.ma === m) || seen.has(m)); return m; };
  rows.slice(hr + 1).forEach((r, k) => {
    const g = key => map[key] === undefined ? '' : r[map[key]];
    const ten = String(g('ten') ?? '').trim(); if (!ten) return;
    const o = { dong: hr + k + 2, has: {} };
    EIMP.forEach(c => {
      const v = g(c.key); o.has[c.key] = map[c.key] !== undefined && String(v ?? '').trim() !== '';
      o[c.key] = c.t === 'money' || c.t === 'int' ? eNum(v) : c.t === 'date' ? eDate(v) : eText(c.key, v);
    });
    o.ten = ten;
    const gt = nh(o.gioiTinh); o.gioiTinh = gt.startsWith('nu') || gt === 'f' ? 'Nữ' : 'Nam';
    const tt = nh(o.trangThai); o.trangThai = tt.includes('thu') ? 'Thử việc' : tt.includes('nghi') ? 'Nghỉ việc' : 'Đang làm';
    o.ma = String(o.ma || '').toUpperCase(); if (!o.ma) o.ma = nextMa();
    if (!o.has.luongBH) o.luongBH = o.luongCB;
    if (seen.has(o.ma)) { o.tt = 'trung'; } else { seen.add(o.ma); o.cu = DB.employees.find(e => e.ma === o.ma); o.tt = o.cu ? 'cu' : 'moi'; }
    out.push(o);
  });
  return out;
}

    r.rec = rec; r.plan = rec && !off ? emps.length : 0;
    emps.forEach(e => {
      const k = (((DB.cham[ym] || {})[e.id] || {}).d || {})[d] || '', c = CODES[k];
      if (!c) { if (r.plan) r.miss++; return; }
      r.cost += e.luongCB / cc * c.hl; r.hl += c.hl;

      r.cnt[k] = (r.cnt[k] || 0) + 1; r.lv += c.lv; r.kl += c.kl;

    });

    const dj = CV().filter(j => j.th === ym + '-' + pad(d)); r.cvN = dj.length; r.cvK = sum(dj, klOf);

  }
  const weeks = []; let w = null;
  days.forEach(r => { if (!w || r.dow === 1) { w = { i: weeks.length + 1, a: r.d, days: [] }; weeks.push(w); } w.days.push(r); w.b = r.d; });
  weeks.forEach(w => {
    const dd = w.days; ['plan', 'lv', 'hl', 'kl', 'cost', 'miss', 'cvN', 'cvK'].forEach(k => w[k] = sum(dd, x => x[k]));
    w.wd = dd.filter(x => x.plan).length; w.rate = w.plan ? Math.min(100, w.lv / w.plan * 100) : null; w.rng = `${w.a}–${w.b}/${+ym.slice(5)}`;

function kpiCalc(ky) {

  return ppl.map(p => {
    const mine = js.filter(j => jNames(j).includes(p)), n = mine.length, kl = sum(mine, j => klOf(j) / jNames(j).length), c = f => mine.filter(f).length;
    const m = { p, n, kl, share: totKl ? kl / totKl : 0, ll: c(j => j.ll), cd: c(j => j.cd), tn: c(j => j.tn), vp: c(j => j.vp), cp: sum(mine, j => j.cp) };
    m.llR = n ? m.ll / n : 0; m.cdR = n ? m.cd / n : 0; m.self = n ? (n - m.tn) / n : 0;
    const a = { kl: m.share >= .7 ? 20 : m.share >= .6 ? 15 : m.share >= .5 ? 10 : 0, cl: m.llR <= .05 ? 20 : m.llR <= .1 ? 15 : 10, tg: 10, bc: 5, kn: m.self >= .95 ? 20 : 15, ph: 10, cd: m.cdR >= .2 ? 10 : m.cdR >= .15 ? 5 : m.cdR >= .1 ? 1 : 0, kt: Math.max(0, 5 - m.vp) };
    const ov = (((DB.kpi || {})[ky] || {})[p]) || {}; m.auto = a; m.ov = ov; m.sc = {}; CRIT.forEach(([k]) => m.sc[k] = ov[k] ?? a[k]); m.tot = sum(CRIT, x => m.sc[x[0]]);
    const e = empOf(p), s = e && summarize(ky, e.id); m.cong = s ? s.lv : null; m.nsuat = s && s.lv ? kl / s.lv : null; return m;

}

const cellStr = v => typeof v === 'number' ? String(v) : String(v ?? '').replace(/\s+/g, ' ').trim();
const nTrue = v => v === true || ['y', 'yes', 'co', 'x', '1', 'true', 'dung'].includes(nh(v));
const numOf = v => typeof v === 'number' ? v : (parseFloat(String(v ?? '').replace(',', '.')) || 0);
const dayNum = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / 864e5;
const colLetter = i => { let s = ''; for (i++; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s; return s; };
const isoDate = v => { const s = eDate(v); return s && !isNaN(dayNum(s)) ? s : ''; };

// Tìm dòng tiêu đề + ghép cột theo tên (không phân biệt dấu/hoa thường). Cột trùng tên được gán lần lượt theo thứ tự khai báo.
function impHeader(rows, spec) {
  let best = null;
  for (let r = 0; r < Math.min(rows.length, 15); r++) {
    const map = {}, used = new Set();
    (rows[r] || []).forEach((h, i) => { const n = nh(h); if (!n) return; const c = spec.find(c => !used.has(c.key) && c.alias.includes(n)); if (c) { used.add(c.key); map[c.key] = i; } });
    const score = Object.keys(map).length;
    if (spec.filter(c => c.req).every(c => map[c.key] !== undefined) && (!best || score > best.score)) best = { hr: r, map, score };
  }
  return best;
}
// Phát hiện ngày gõ nhầm năm (vd 29/09/2029) dựa trên ngày trung vị của cả sheet
function impFixYear(list, fields, main, on, labels) {
  const ds = list.map(o => o[main]).filter(Boolean).map(dayNum).sort((a, b) => a - b); if (!ds.length) return;
  const med = ds[ds.length >> 1], y0 = new Date(med * 864e5).getUTCFullYear();
  list.forEach(o => fields.forEach(f => {
    const v = o[f]; if (!v || Math.abs(dayNum(v) - med) <= 200) return;
    let best = null; [y0 - 1, y0, y0 + 1].forEach(y => { const c = y + v.slice(4), d = dayNum(c); if (!isNaN(d) && (!best || Math.abs(d - med) < Math.abs(best.d - med))) best = { c, d }; });
    if (on && best && Math.abs(best.d - med) <= 60) { o.warn.push(`Đã sửa năm ${v.slice(0, 4)} → ${best.c.slice(0, 4)} (${labels[f]})`); o[f] = best.c; o.fixed = 1; }
    else o.warn.push(`Ngày bất thường ${F.date(v)} (${labels[f]})`);
  }));
}
// Chuẩn hóa người xử lý: "Ma Phúc Kết" -> "Kết", "Quân+Kết" -> "Quân + Kết". learn = Map để gom người mới (null = không học thêm)
function impPeople(raw, learn) {
  const ns = CFG().nhanSu;
  return String(raw ?? '').split('+').map(s => s.replace(/\s+/g, ' ').trim()).filter(Boolean).map(p => {
    let hit = ns.find(x => nh(x.ten) === nh(p) || (x.full && nh(x.full) === nh(p))); if (hit) return hit.ten;
    const w = p.split(' '), person = w.length >= 2 && w.length <= 4 && w.every(x => /^\p{Lu}/u.test(x)) && !/^thu[eê]/i.test(p), t = person ? w[w.length - 1] : p;
    hit = ns.find(x => nh(x.ten) === nh(t)); if (hit) return hit.ten;
    if (learn && !/^thu[eê]/i.test(p)) { if (!learn.has(t)) learn.set(t, { ten: t, full: person ? p : '', sdt: '' }); }
    return t;
  }).join(' + ');
}
const canon = (list, v) => { v = cellStr(v); const k = v.toLowerCase(); return list.map(nm).find(x => x.toLowerCase() === k) || v; };
const addUniq = (list, v, sorted) => { if (v && !list.some(x => nm(x).toLowerCase() === v.toLowerCase())) { list.push(typeof list[0] === 'object' ? { ten: v, gc: '' } : v); if (sorted) list.sort((a, b) => nm(a).localeCompare(nm(b), 'vi')); return 1; } return 0; };

// Phân loại mới / trùng: dòng thứ k trong file khớp dòng thứ k đã có (nhập lại cùng file không bị nhân đôi, việc lặp thật vẫn giữ được)
function impClassify(items, existing, keyOf, exKey) {
  const ex = new Map(); existing.forEach(j => { const k = exKey(j); if (!ex.has(k)) ex.set(k, []); ex.get(k).push(j); });
  const seen = new Map();
  items.forEach(o => {
    if (o.err.length) { o.st = 'loi'; return; }
    const k = keyOf(o), n = seen.get(k) || 0; seen.set(k, n + 1); const a = ex.get(k) || [];
    if (n < a.length) { o.st = 'trung'; o.cu = a[n]; } else { o.st = 'moi'; o.cu = null; }
  });
}

/* ---------- Nhập báo cáo KPI (nhật ký công việc + bảng điểm tháng) ---------- */
const KIMP = [
  { key: 'tt', label: 'Trung tâm', alias: ['trungtam', 'coso', 'diadiem'], req: 1 },
  { key: 'nn', label: 'Ngày nhận thông tin', alias: ['ngaynhanthongtin', 'ngaynhan', 'ngaybao'] },
  { key: 'nb', label: 'Người báo', alias: ['nguoibao', 'nguoiyeucau'] },
  { key: 'hm', label: 'Hạng mục công việc', alias: ['hangmuccongviec', 'hangmuc'] },
  { key: 'ct', label: 'Chi tiết xử lý', alias: ['chitietxuly', 'chitiet', 'noidungcongviec', 'noidung'], req: 1 },
  { key: 'sl', label: 'SL', alias: ['sl', 'soluong'] },
  { key: 'hs', label: 'Hệ số', alias: ['heso'] },
  { key: 'dk', label: 'Độ khó', alias: ['dokho'] },
  { key: 'kl', label: 'Khối lượng quy đổi (để đối chiếu)', alias: ['khoiluongquydoi', 'khoiluong'] },
  { key: 'ng', label: 'Người xử lý', alias: ['nguoixuly', 'nguoithuchien', 'nhansu'], req: 1 },
  { key: 'cp', label: 'Chi phí phát sinh', alias: ['chiphiphatsinh', 'chiphi'] },
  { key: 'gc', label: 'Ghi chú', alias: ['ghichu'] },
  { key: 'th', label: 'Ngày thực hiện', alias: ['ngaythuchien'], req: 1 },
  { key: 'ht', label: 'Ngày hoàn thành', alias: ['ngayhoanthanh'] },
  { key: 'pk', label: 'Thời gian phản hồi', alias: ['thoigianphanhoi', 'phanhoi'] },
  { key: 'll', label: 'Lỗi lặp lại / tái phát sinh', alias: ['coloilaplai', 'loilaplai', 'loitaiphatsinhyn', 'loitaiphatsinh'] },
  { key: 'cd', label: 'Chủ động', alias: ['congviecchudongxuly', 'chudongyn', 'chudong'] },
  { key: 'tn', label: 'Thuê ngoài', alias: ['thuengoaiyn', 'thuengoai'] },
  { key: 'vp', label: 'Vi phạm nội quy', alias: ['viphamnoiquy', 'vipham'] },
  { key: 'vn', label: 'Nội dung vi phạm', alias: ['noidungvipham'] },
  { key: 'bc', label: 'Thời gian báo cáo công việc', alias: ['thoigianbaocaocongviec', 'thoigianbaocao'] }
];
const KCRIT = [['kl', 'diemkhoiluong'], ['cl', 'diemchatluong'], ['tg', 'diemthoigian'], ['bc', 'diembaocao'], ['kn', 'diemkynang'], ['ph', 'diemphanhoi'], ['cd', 'diemchudong'], ['kt', 'diemkyluat']];
const kKey = o => [o.th, nh(o.tt), nh(o.ct), nh(o.ng), +o.sl || 0].join('|');
function kpiBuild(s, st) {
  const items = [], map = s.map; s.skipped = 0;
  s.rows.slice(s.hr + 1).forEach((r, i) => {
    const g = k => map[k] === undefined ? '' : r[map[k]], ct = cellStr(g('ct'));
    if (!ct) { if (r.some(c => cellStr(c) !== '')) s.skipped++; return; }
    const o = { dong: s.hr + i + 2, sheet: s.name, err: [], warn: [] };
    o.tt = canon(CFG().trungTam, g('tt')); o.nb = canon(CFG().nguoiBao, g('nb')); o.hm = canon(CFG().hangMuc, g('hm')); o.ct = ct;
    o.sl = numOf(g('sl')) || 1; o.hs = numOf(g('hs')) || hsOf(o.sl); o.dk = Math.min(5, Math.max(1, Math.round(numOf(g('dk')) || 1)));
    o.ng = impPeople(g('ng'), st.newP); o.cp = eNum(g('cp')); o.gc = cellStr(g('gc'));
    o.nn = isoDate(g('nn')); o.th = isoDate(g('th')); o.ht = isoDate(g('ht')); o.pk = cellStr(g('pk'));
    ['ll', 'cd', 'tn', 'vp'].forEach(k => o[k] = nTrue(g(k))); o.vn = cellStr(g('vn'));
    const b = g('bc'); o.bc = typeof b === 'number' && b > 59 ? isoDate(b) : cellStr(b);
    const kl = g('kl'); if (map.kl !== undefined && kl !== '' && Math.abs(numOf(kl) - o.hs * o.dk) > 0.01) o.warn.push(`KL trong file ${numOf(kl)} ≠ HS×ĐK ${o.hs * o.dk}`);
    items.push(o);
  });

      else used.forEach(o => { if (o.st === 'moi' || mode === 'tatca') { SC().push(mk(o)); add++; } else if (mode === 'capnhat' && o.cu) { const { id, ...d } = mk(o); Object.assign(o.cu, d); upd++; } else same++; });
      let nt = 0; if (st.opt.learn) used.forEach(o => { if (!scVague(o.tt)) nt += addUniq(CFG().trungTam, o.tt); });
      UI.sc = { m: '', t: '', s: '', p: '' };
      return `Đã nhập <b>${add}</b> hạng mục sửa chữa${upd ? `, cập nhật <b>${upd}</b>` : ''}${same ? `, bỏ qua <b>${same}</b> dòng trùng` : ''}${del ? `, thay thế <b>${del}</b> dòng cũ` : ''}${nt ? `; thêm ${nt} trung tâm vào danh mục` : ''}.`;
    },
    template: () => ({ name: 'Hạng mục sửa chữa', title: 'HẠNG MỤC SỬA CHỮA TRUNG TÂM', subtitles: ['Mỗi hạng mục một dòng. Bắt buộc: Ngày đề xuất, Nội dung công việc (và Trung tâm nếu nhập chung một sheet). Ngày ghi dạng 15/03/2026. Kết quả: Hoàn thành / Đang xử lý / Chờ cấp thiết bị / Chưa xử lý.'], noFilter: true,
      columns: RIMP.map(c => ({ label: c.label, type: c.key === 'sl' || c.key === 'thang' ? 'num' : 'text', width: c.key === 'ct' ? 42 : 16 })),
      rows: [['16/10/2026', 10, 'Mỹ Đình - Nhà 23', 'Sửa chữa', 'Điều hòa tầng 3 phòng 304 bị chảy nước', 'Nhà 23', 'chiếc', 1, '', '', '18/10/2026', '17/10/2026', '', 'Kết', 'Hoàn thành', 'Lệch áp suất không khí']] })
  });
}
UI.sc = { m: '', t: '', s: '', p: '' };
const scForm = (j, dup) => {
  const isNew = !j || dup, base = j ? { ...j } : { nd: D.today(), hm: 'Sửa chữa', sl: 1 }; if (dup) { delete base.id; base.nd = D.today(); base.xl = ''; base.kq = ''; }
  const c = CFG();
  Form.open({ title: isNew ? (dup ? 'Nhân bản hạng mục' : 'Thêm hạng mục sửa chữa') : 'Sửa hạng mục sửa chữa', width: 820, value: base, onSave: d => { d.sl = +d.sl || 0; d.ky = d.nd.slice(0, 7); if (isNew) SC().push({ id: uid(), ...d }); else Object.assign(j, d); App.changed(); toast('Đã lưu hạng mục', 'ok'); },
    onDelete: isNew ? null : () => { DB.sc = SC().filter(x => x !== j); App.changed(); },
    fields: [{ type: 'section', label: 'Đề xuất của trung tâm' }, { key: 'nd', label: 'Ngày đề xuất', type: 'date', required: true }, { key: 'tt', label: 'Trung tâm', list: () => c.trungTam.map(nm), required: true },
      { key: 'hm', label: 'Hạng mục', list: () => SC_HM }, { key: 'dc', label: 'Địa chỉ / nhà' }, { key: 'ct', label: 'Nội dung công việc', type: 'textarea', full: true, required: true },
      { key: 'sl', label: 'Số lượng', type: 'number', min: 0 }, { key: 'dvt', label: 'ĐVT', list: () => ['chiếc', 'phòng', 'cái', 'bộ', 'm2'] }, { key: 'ha', label: 'Hình ảnh đề xuất (ghi chú)', full: true }, { key: 'gc', label: 'Ghi chú đề xuất', full: true },
      { type: 'section', label: 'Phòng Hành chính – kỹ thuật xử lý' }, { key: 'dk', label: 'Ngày dự kiến hoàn thành', type: 'date' }, { key: 'xl', label: 'Ngày xử lý', type: 'date' },
      { key: 'ng', label: 'Người thực hiện', list: () => [...c.nhanSu.map(nm), 'Thuê đối tác'], hint: 'Nhiều người: "Kết + Nam"' }, { key: 'kq', label: 'Kết quả', type: 'select', blank: '(chưa cập nhật)', options: () => [...new Set([...SC_KQ, ...SC().map(x => x.kq).filter(Boolean)])] },
      { key: 'ha2', label: 'Hình ảnh sau xử lý (ghi chú)', full: true }, { key: 'gc2', label: 'Ghi chú xử lý', full: true }] });
};
const scCols = [
  { key: 'nd', label: 'Ngày ĐX', fmt: 'date', w: '88px' }, { key: 'tt', label: 'Trung tâm' }, { key: 'hm', label: 'Hạng mục' }, { key: 'ct', label: 'Nội dung công việc', cls: 'wrap', w: '280px' },
  { key: 'sl', label: 'SL', fmt: 'num', val: j => j.sl || '' }, { key: 'dvt', label: 'ĐVT' }, { key: 'ng', label: 'Người thực hiện' }, { key: 'xl', label: 'Ngày xử lý', fmt: 'date', w: '88px' },
  { key: 'sn', label: 'Số ngày', fmt: 'num', val: j => scDays(j) ?? '' }, { key: 'kq', label: 'Kết quả', render: j => j.kq ? `<span class="badge ${scTone(j.kq)}">${esc(j.kq)}</span>` : '<span class="muted small">chưa ghi</span>', val: j => j.kq },
  { key: 'gc2', label: 'Ghi chú xử lý', cls: 'wrap', val: j => [j.gc2, j.gc].filter(Boolean).join(' | ') }];
const vSC = {
  title: 'Hạng mục sửa chữa trung tâm', icon: 'building', desc: 'Theo dõi các hạng mục trung tâm đề xuất: ai xử lý, bao giờ xong, kết quả; nhập từ file Excel của phòng Hành chính',
  tools: () => `<button class="btn" data-act="scImport">${ic('upload')} Nhập hạng mục sửa chữa</button><button class="btn pri" data-act="scAdd">${ic('plus')} Thêm hạng mục</button>`,
  rows() { const f = UI.sc; return SC().filter(j => (!f.m || j.ky === f.m) && (!f.t || scArea(j.tt) === f.t) && (!f.s || (f.s === '_' ? !j.kq : j.kq === f.s)) && (!f.p || String(j.ng || '').split('+').map(x => x.trim()).includes(f.p))); },
  render(el) {
    const all = SC(), f = UI.sc, rows = vSC.rows(), cnt = k => rows.filter(j => j.kq === k).length;
    const mons = [...new Set(all.map(j => j.ky).filter(Boolean))].sort(), areas = [...new Set(all.map(j => scArea(j.tt)).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'vi')), ppl = [...new Set(all.flatMap(j => String(j.ng || '').split('+').map(x => x.trim())).filter(Boolean))];
    const done = cnt('Hoàn thành'), dd = rows.map(scDays).filter(x => x != null && x >= 0), avg = dd.length ? dd.reduce((a, b) => a + b, 0) / dd.length : null;
    const grp = (fn, n = 12) => Object.entries(by(rows, fn)).map(([k, a]) => ({ label: k || '(trống)', value: a.length })).sort((a, b) => b.value - a.value).slice(0, n);
    const st = Object.entries(by(rows, j => j.kq || 'Chưa ghi kết quả')).map(([k, a]) => ({ label: k, value: a.length, color: k === 'Hoàn thành' ? '#10b981' : k === 'Chưa xử lý' ? '#ef4444' : k === 'Chưa ghi kết quả' ? '#94a3b8' : '#f59e0b' }));
    App.subtitle = f.m ? F.month(f.m) : 'Tất cả các tháng';
    el.innerHTML = `<div class="kpis">${kpi({ label: 'Tổng hạng mục', value: rows.length, sub: all.length === rows.length ? 'Toàn bộ danh sách' : `Đang lọc / ${all.length}`, icon: 'kanban' })}${kpi({ label: 'Đã hoàn thành', value: done, sub: pc(rows.length ? done / rows.length * 100 : 0), icon: 'check', tone: 'green' })}${kpi({ label: 'Đang xử lý / chờ vật tư', value: rows.filter(j => j.kq && !['Hoàn thành', 'Chưa xử lý'].includes(j.kq)).length, icon: 'clock' })}${kpi({ label: 'Chưa xử lý / chưa ghi', value: rows.filter(j => !j.kq || j.kq === 'Chưa xử lý').length, icon: 'alert' })}${kpi({ label: 'Thời gian xử lý TB', value: avg == null ? '–' : F.num(avg, 1) + ' ngày', sub: dd.length + ' hạng mục có ngày xử lý', icon: 'trend' })}</div>
    <div class="grid cols-2 mb">${card('Theo trung tâm', Chart.hbars({ items: grp(j => scArea(j.tt)), fmt: v => F.num(v, 0) }))}${card('Theo kết quả', Chart.donut({ items: st, center: String(rows.length), centerSub: 'hạng mục', fmt: v => F.num(v, 0) }))}</div><div id="scT"></div>`;
    table($('#scT', el), { id: 'sc', compact: 1, columns: scCols, rows, sort: 0, dir: -1, ph: 'Tìm trung tâm, nội dung, người thực hiện...', onRow: scForm, empty: all.length ? 'Không có hạng mục nào khớp bộ lọc.' : 'Chưa có hạng mục. Bấm "Nhập hạng mục sửa chữa" để nhập từ Excel hoặc "Thêm hạng mục".',
      actions: j => rowBtns(j.id, 'scEdit', 'scDel', `<button class="ibtn" data-act="scDup" data-id="${j.id}" data-tip="Nhân bản">${ic('copy')}</button>`),
      tools: `${selectHTML('scM', [{ value: '', label: 'Tất cả tháng' }, ...mons.map(m => ({ value: m, label: F.month(m) }))], f.m)}${selectHTML('scC', [{ value: '', label: 'Tất cả trung tâm' }, ...areas], f.t)}${selectHTML('scS', [{ value: '', label: 'Mọi kết quả' }, ...[...new Set([...SC_KQ, ...all.map(j => j.kq).filter(Boolean)])].map(x => ({ value: x, label: x })), { value: '_', label: 'Chưa ghi kết quả' }], f.s)}${selectHTML('scP', [{ value: '', label: 'Mọi người thực hiện' }, ...ppl], f.p)}<span class="grow"></span><button class="btn danger sm" data-act="scClear">${ic('trash')} Xóa tất cả</button>` });
    onVal('scM', v => { f.m = v; App.render(); }); onVal('scC', v => { f.t = v; App.render(); }); onVal('scS', v => { f.s = v; App.render(); }); onVal('scP', v => { f.p = v; App.render(); });
  },
  excel() { XLSX.save('Hang muc sua chua trung tam', [xSheet('Hạng mục sửa chữa', 'HẠNG MỤC SỬA CHỮA TRUNG TÂM', scCols, vSC.rows())]); }
};
Object.assign(ACT, {
  kpiImport: () => kpiImport(), scImport: () => scImport(), scAdd: () => scForm(), scEdit: d => scForm(SC().find(x => x.id === d.id)), scDup: d => scForm(SC().find(x => x.id === d.id), true),
  scDel: async d => { if (await Modal.confirm('Xóa hạng mục này?', { ok: 'Xóa', danger: true })) { DB.sc = SC().filter(x => x.id !== d.id); App.changed(); } },
  scClear: async () => { const n = SC().length; if (n && await Modal.confirm(`Xóa <b>${n}</b> hạng mục sửa chữa? Không hoàn tác được.`, { ok: 'Xóa hết', danger: true })) { DB.sc = []; App.changed(); } }
});

App.init({
  id: 'luong', title: 'Chấm công & Tính lương', tagline: 'Thuế TNCN · BHXH · Phiếu lương', icon: 'wallet', fileName: 'Cham cong va Tinh luong.html', theme: THEME,
  palette: ['#10b981', '#f59e0b', '#8b5cf6', '#ef4444', '#06b6d4', '#ec4899', '#64748b'],
  sample: sampleDB, empty: emptyDB, migrate,
  counts: () => [['Nhân viên', DB.employees.length], ['Tháng có chấm công', Object.keys(DB.cham).length], ['Công việc đã ghi', (DB.cv || []).length], ['Hạng mục sửa chữa', (DB.sc || []).length]],
  nav: [{ group: 'Tổng quan', items: ['dashboard'] }, { group: 'Nghiệp vụ', items: ['nhanvien', 'chamcong', 'congviec', 'kpicv', 'suachua', 'baocao', 'bangluong', 'thue'] }, { group: 'Thiết lập', items: ['danhmuc', 'caidat'] }],
  views: { dashboard: vDash, nhanvien: vEmp, chamcong: vCham, congviec: vCV, kpicv: vKP, suachua: vSC, danhmuc: vDM, baocao: vBC, bangluong: vLuong, thue: vThue, caidat: vSet }
});
